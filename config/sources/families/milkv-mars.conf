ARCH="riscv64"

LINUXCONFIG="linux-milkv-mars-${BRANCH}"
LINUXFAMILY="milkv-mars"

case "${BRANCH}" in

edge)
	declare -g KERNEL_MAJOR_MINOR="6.14" # Major and minor versions of this kernel. For mainline caching.
	KERNELSOURCE='https://github.com/starfive-tech/linux'
	KERNELBRANCH="branch:visionfive"
	KERNELPATCHDIR="milkv-mars-${BRANCH}"
	;;

esac

#KERNELPATCHDIR="archive/milkv-mars-${KERNEL_MAJOR_MINOR}" # Don't use symlinks.
